<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C Steps: learn C one program at a time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F2F5F7;
  --grid: #E2E9EE;
  --ink: #1A2735;
  --muted: #55636F;
  --line: #C9D3DC;
  --surface: #FFFFFF;
  --mark: #FFE45C;
  --mark-ink: #1A2735;
  --code-bg: #1D2330;
  --code-ink: #E3E7EE;
  --term-dim: #8792A6;
  --ok: #1B6E42;
  --ok-bg: #E2F2E8;
  --bad: #A8221A;
  --bad-bg: #FBE8E6;
  --link: #1F4FA0;
  --warn-bg: #FFF7D6;
  --warn-line: #E0C23A;
  --sans: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11161D; --grid: #182029; --ink: #E3E8EE; --muted: #9AA6B2; --line: #2B3541;
    --surface: #18202A; --mark: #E9CB3F; --mark-ink: #11161D; --code-bg: #0B0F15; --code-ink: #E3E7EE;
    --ok: #74D39E; --ok-bg: #16301F; --bad: #FF8E80; --bad-bg: #3A1B18; --link: #8EB5F6;
    --warn-bg: #2A2612; --warn-line: #8C7A24;
  }
}
:root[data-theme="dark"] {
  --paper: #11161D; --grid: #182029; --ink: #E3E8EE; --muted: #9AA6B2; --line: #2B3541;
  --surface: #18202A; --mark: #E9CB3F; --mark-ink: #11161D; --code-bg: #0B0F15; --code-ink: #E3E7EE;
  --ok: #74D39E; --ok-bg: #16301F; --bad: #FF8E80; --bad-bg: #3A1B18; --link: #8EB5F6;
  --warn-bg: #2A2612; --warn-line: #8C7A24;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--sans);
  font-size: 1.0625rem;
  line-height: 1.6;
  color: var(--ink);
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
a { color: var(--link); }
:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; border-radius: 3px; }
img { max-width: 100%; }
code { font-family: var(--mono); font-size: .88em; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: .05em .3em; }
button { font: inherit; color: inherit; cursor: pointer; }
pre code { background: none; border: 0; padding: 0; font-size: inherit; border-radius: 0; color: inherit; }

/* top bar */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 1rem;
  padding: .6rem 1.25rem;
  background: var(--surface);
  border-bottom: 2px solid var(--ink);
}
.brand { display: flex; align-items: baseline; gap: .5rem; text-decoration: none; color: var(--ink); }
.brand b { font-family: var(--mono); font-weight: 600; font-size: 1.35rem; background: var(--mark); color: var(--mark-ink); padding: 0 .35rem; border-radius: 3px; }
.brand span { font-weight: 700; font-size: 1.1rem; }
.progress { margin-left: auto; display: flex; align-items: center; gap: .6rem; font-size: .9rem; color: var(--muted); }
.bar { width: 120px; height: 8px; border: 1px solid var(--ink); border-radius: 4px; overflow: hidden; background: var(--paper); }
.bar i { display: block; height: 100%; background: var(--ink); width: 0; transition: width .3s; }
.menu-btn { display: none; background: none; border: 1px solid var(--line); border-radius: 6px; padding: .3rem .7rem; }

/* layout */
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); max-width: 1180px; margin: 0 auto; }
nav.lessons { position: sticky; top: 58px; align-self: start; max-height: calc(100vh - 58px); overflow-y: auto; padding: 1.5rem 1rem 2rem 1.25rem; }
nav.lessons h2 { font-size: .95rem; margin: 0 0 .6rem .5rem; border: 0; padding: 0; color: var(--muted); font-weight: 400; }
nav.lessons ol { list-style: none; margin: 0; padding: 0; }
nav.lessons a {
  display: grid; grid-template-columns: 2rem 1fr auto; align-items: center;
  padding: .45rem .5rem; border-radius: 6px; text-decoration: none; color: var(--ink); line-height: 1.3;
}
nav.lessons a:hover { background: var(--surface); }
nav.lessons a[aria-current="page"] { background: var(--mark); color: var(--mark-ink); font-weight: 700; }
nav.lessons .num { font-family: var(--mono); font-size: .85rem; color: var(--muted); }
nav.lessons a[aria-current="page"] .num { color: var(--mark-ink); }
nav.lessons .tick { font-size: .85rem; color: var(--ok); font-weight: 700; }
nav.lessons a[aria-current="page"] .tick { color: var(--mark-ink); }
nav.lessons .home-link { grid-template-columns: 1fr; margin-bottom: .75rem; }

main { padding: 2rem 1.5rem 5rem; min-width: 0; }
article { max-width: 70ch; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 2rem 2.25rem 2.5rem; }
.crumb { margin: 0 0 .25rem; color: var(--muted); font-size: .95rem; }
h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); line-height: 1.15; margin: 0 0 .5rem; letter-spacing: -.01em; }
.lede { font-size: 1.2rem; color: var(--muted); margin: 0 0 1.5rem; }
h2 { font-size: 1.35rem; margin: 2.5rem 0 .75rem; padding-top: 1.25rem; border-top: 2px solid var(--ink); }
h3 { font-size: 1.05rem; margin: 0 0 .4rem; }
article ul { padding-left: 1.2rem; }
article li { margin: .2rem 0; }

/* code */
.code { position: relative; margin: 1rem 0 0; border-radius: 8px; background: var(--code-bg); color: var(--code-ink); }
.code pre { margin: 0; padding: 1rem 1.1rem; overflow-x: auto; font-family: var(--mono); font-size: .88rem; line-height: 1.55; tab-size: 4; }
.code .copy {
  position: absolute; top: .5rem; right: .5rem;
  background: transparent; color: var(--term-dim); border: 1px solid #3A4456; border-radius: 5px;
  font-size: .78rem; padding: .15rem .55rem;
}
.code .copy:hover { color: var(--code-ink); border-color: var(--code-ink); }
.tk-kw { color: #FF9E64; }
.tk-str { color: #A8DB8F; }
.tk-com { color: #7C879B; font-style: italic; }
.tk-pre { color: #86AFFF; }
.tk-num { color: #F5CB6E; }
.tk-fn { color: #7FDBCA; }
pre.cmd { font-family: var(--mono); font-size: .88rem; background: var(--code-bg); color: var(--code-ink); padding: .7rem 1rem; border-radius: 6px; overflow-x: auto; margin: .5rem 0; }

.output { margin: 0 0 1rem; border: 1px solid var(--code-bg); border-top: 0; border-radius: 0 0 8px 8px; background: var(--paper); }
.code.has-output { border-radius: 8px 8px 0 0; }
.output .label { display: block; padding: .35rem 1.1rem 0; font-size: .82rem; color: var(--muted); }
.output pre { margin: 0; padding: .2rem 1.1rem .8rem; font-family: var(--mono); font-size: .88rem; white-space: pre-wrap; overflow-x: auto; }

/* predict */
.predict { border: 2px solid var(--ink); border-radius: 10px; padding: 1.1rem 1.1rem 1.25rem; margin-top: 1rem; }
.predict > p { margin: .9rem 0 .6rem; font-weight: 700; }
.choices { display: grid; gap: .5rem; }
.choice {
  display: block; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: .55rem .8rem; font-family: var(--mono); font-size: .9rem; white-space: pre-wrap;
}
.choice:hover:not([disabled]) { border-color: var(--ink); }
.choice[disabled] { cursor: default; }
.choice.right { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.choice.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); text-decoration: line-through; }
.feedback { margin-top: .75rem; padding: .6rem .8rem; border-radius: 6px; border-left: 4px solid; }
.feedback.good { background: var(--ok-bg); border-color: var(--ok); }
.feedback.nope { background: var(--bad-bg); border-color: var(--bad); }
.feedback b { display: block; }
.term-print { font-family: var(--mono); background: var(--code-bg); color: var(--code-ink); border-radius: 6px; padding: .6rem .9rem; margin-top: .6rem; white-space: pre-wrap; }
.term-print::before { content: "$ ./a.out\A"; color: var(--term-dim); white-space: pre; }
.term-print.file::before { content: "$ cat log.txt\A"; }

/* quiz */
.q { margin: 1.25rem 0; }
.q > p { margin: 0 0 .5rem; font-weight: 700; }
.q .choice { font-family: var(--sans); font-size: 1rem; }

/* mistake */
.mistake { margin-top: 2rem; background: var(--warn-bg); border-left: 5px solid var(--warn-line); border-radius: 0 8px 8px 0; padding: .9rem 1.1rem; }
.mistake p { margin: 0; }

/* practice */
details { margin-top: .75rem; border: 1px solid var(--line); border-radius: 8px; }
summary { cursor: pointer; padding: .6rem .9rem; font-weight: 700; }
details[open] summary { border-bottom: 1px solid var(--line); }
details > div { padding: .8rem .9rem; }
details .code { margin-top: 0; }

/* lesson end */
.lesson-end { margin-top: 2.5rem; padding-top: 1.25rem; border-top: 2px solid var(--ink); display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }
.btn { display: inline-block; text-decoration: none; border-radius: 8px; padding: .6rem 1.1rem; font-weight: 700; border: 2px solid var(--ink); background: var(--surface); color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--surface); }
.btn.done { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.lesson-end .spacer { flex: 1; }

/* home */
.hero { display: grid; gap: 1.5rem; }
.hero h1 { font-size: clamp(2.2rem, 5.5vw, 3.4rem); max-width: 16ch; }
.hero-term { background: var(--code-bg); color: var(--code-ink); border-radius: 10px; font-family: var(--mono); font-size: .92rem; overflow: hidden; }
.hero-term pre { margin: 0; padding: 1rem 1.2rem; overflow-x: auto; }
.hero-term .run { border-top: 1px solid #2E3747; padding: .8rem 1.2rem 1rem; min-height: 5.2rem; white-space: pre-wrap; }
.hero-term .dim { color: var(--term-dim); }
.caret { display: inline-block; width: .55em; height: 1.1em; background: var(--code-ink); vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 2.2rem 1fr; margin: .6rem 0; }
.steps li::before { content: counter(s); font-family: var(--mono); font-weight: 600; width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font-size: .85rem; }
.os { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
.os div { border: 1px solid var(--line); border-radius: 8px; padding: .8rem 1rem; }
.os p { margin: .2rem 0; font-size: .95rem; }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .menu-btn { display: inline-block; }
  nav.lessons {
    display: none; position: fixed; top: 54px; left: 0; right: 0; bottom: 0; max-height: none;
    background: var(--surface); z-index: 15; border-bottom: 2px solid var(--ink);
  }
  nav.lessons.open { display: block; }
  main { padding: 1rem .75rem 4rem; }
  article { padding: 1.4rem 1.1rem 2rem; }
  .bar { width: 70px; }
  .brand span { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .caret { animation: none; }
  .bar i { transition: none; }
}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/"><b>C</b><span>Steps</span></a>
  <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="lessonNav">Lessons</button>
  <div class="progress" aria-live="polite">
    <span id="progText">0 of 12 done</span>
    <div class="bar" aria-hidden="true"><i id="progBar"></i></div>
  </div>
</header>

<div class="layout">
  <nav class="lessons" id="lessonNav" aria-label="Lessons"></nav>
  <main id="main"></main>
</div>

<script>
const LESSONS = [
{
  title: "Your first program",
  summary: "What a C program looks like and how to run one.",
  body: [
    "C is a small, fast language. Operating systems, microcontrollers and many other languages are written in it. Learning C teaches you how a computer actually stores and moves data.",
    "Every C program starts running in a function called <code>main</code>. The line <code>#include &lt;stdio.h&gt;</code> brings in the standard input/output library, which gives you <code>printf</code> for printing text.",
    "<code>\\n</code> inside a string means \"start a new line\". <code>return 0;</code> tells the system the program finished without errors. Every statement ends with a semicolon.",
    "To run it, save the code as <code>hello.c</code>, then compile and run it:<pre class=\"cmd\">gcc hello.c -o hello\n./hello</pre>On Windows, the second line is <code>hello.exe</code>."
  ],
  code: String.raw`#include <stdio.h>

int main(void) {
    printf("Hello, world!\n");
    printf("I am learning C.\n");
    return 0;
}`,
  output: "Hello, world!\nI am learning C.",
  mistake: "Forgetting the semicolon at the end of a statement. The compiler usually reports the error on the <em>next</em> line, so check the line above the one it points to.",
  predict: {
    full: true,
    code: String.raw`#include <stdio.h>

int main(void) {
    printf("One ");
    printf("Two\n");
    printf("Three\n");
    return 0;
}`,
    options: ["One\nTwo\nThree", "One Two\nThree", "One Two Three"],
    answer: 1,
    why: "The first printf has no \\n, so \"Two\" is printed on the same line. Only a \\n moves to the next line."
  },
  quiz: [
    { q: "Which line lets you use printf?", options: ["#include <stdio.h>", "int main(void)", "return 0;"], answer: 0, why: "printf is declared in stdio.h, so you need to include it first." },
    { q: "Where does a C program start running?", options: ["At the first line of the file", "Inside the main function", "Inside the last function in the file"], answer: 1, why: "The system always calls main first, wherever it sits in the file." }
  ],
  practice: {
    task: "Write a program that prints your name on the first line and your city on the second line.",
    hint: "Use two printf calls, each ending with \\n.",
    solution: String.raw`#include <stdio.h>

int main(void) {
    printf("Priya\n");
    printf("Chennai\n");
    return 0;
}`,
    output: "Priya\nChennai"
  }
},
{
  title: "Variables and data types",
  summary: "Storing numbers and letters, and printing them.",
  body: [
    "A variable is a named spot in memory that holds a value. In C you must say what type of value it holds before you use it.",
    "<ul><li><code>int</code> holds whole numbers like 42 or -7.</li><li><code>float</code> holds decimal numbers with about 6 digits of accuracy.</li><li><code>double</code> holds decimal numbers with about 15 digits of accuracy.</li><li><code>char</code> holds one character, written in single quotes like <code>'A'</code>.</li></ul>",
    "To print a variable, put a format specifier in the printf string: <code>%d</code> for int, <code>%f</code> for float or double, <code>%c</code> for char. <code>%.2f</code> prints two digits after the decimal point.",
    "<code>sizeof</code> tells you how many bytes a type uses. On most computers today an <code>int</code> is 4 bytes."
  ],
  code: String.raw`#include <stdio.h>

int main(void) {
    int age = 19;
    float height = 5.6f;
    double pi = 3.14159265;
    char grade = 'A';

    printf("Age: %d\n", age);
    printf("Height: %.1f feet\n", height);
    printf("Pi: %.4f\n", pi);
    printf("Grade: %c\n", grade);
    printf("An int uses %zu bytes\n", sizeof(int));
    return 0;
}`,
  output: "Age: 19\nHeight: 5.6 feet\nPi: 3.1416\nGrade: A\nAn int uses 4 bytes",
  mistake: "Printing a float with <code>%d</code>. The compiler may only warn you, and the program prints a wrong number. Always match the specifier to the type.",
  predict: {
    code: String.raw`int a = 10;
int b = a;
a = 25;
printf("%d %d\n", a, b);`,
    options: ["25 25", "25 10", "10 25"],
    answer: 1,
    why: "b = a copies the value 10 into b. Changing a later does not touch b."
  },
  quiz: [
    { q: "Which type should hold the letter 'Q'?", options: ["int", "char", "float"], answer: 1, why: "char holds a single character." },
    { q: "What does printf(\"%.2f\", 3.14159) print?", options: ["3.14159", "3.1", "3.14"], answer: 2, why: "%.2f keeps two digits after the decimal point and rounds." }
  ],
  practice: {
    task: "A rectangle is 7.5 units long and 4 units wide. Store both in variables, calculate the area, and print it with two decimal places.",
    hint: "Use float for all three values and %.2f to print.",
    solution: String.raw`#include <stdio.h>

int main(void) {
    float length = 7.5f;
    float width = 4.0f;
    float area = length * width;
    printf("Area: %.2f\n", area);
    return 0;
}`,
    output: "Area: 30.00"
  }
},
{
  title: "Reading input with scanf",
  summary: "Getting numbers from the keyboard.",
  body: [
    "<code>scanf</code> reads what the user types and stores it in your variables. It uses the same kind of format specifiers as printf.",
    "Put <code>&amp;</code> before each variable name. <code>&amp;a</code> means \"the address of a\". scanf needs the address so it knows where in memory to put the value. You will learn more about addresses in the pointers lesson.",
    "One difference from printf: to read a <code>double</code> you must use <code>%lf</code>. For float use <code>%f</code>, for int use <code>%d</code>."
  ],
  code: String.raw`#include <stdio.h>

int main(void) {
    int a, b;
    printf("Enter two numbers: ");
    scanf("%d %d", &a, &b);
    printf("Sum = %d\n", a + b);
    return 0;
}`,
  input: "5 7",
  output: "Enter two numbers: 5 7\nSum = 12",
  outputLabel: "Output when you type 5 7",
  mistake: "Leaving out the <code>&amp;</code>, as in <code>scanf(\"%d\", a)</code>. The program may crash or store the number somewhere random.",
  predict: {
    code: String.raw`int n;
scanf("%d", &n);
printf("%d squared is %d\n", n, n * n);`,
    input: "4",
    question: "The user types 4. What prints?",
    options: ["4 squared is 16", "n squared is n * n", "16 squared is 4"],
    answer: 0,
    why: "Each %d is replaced by the next value in the list: first n (4), then n * n (16)."
  },
  quiz: [
    { q: "Why does scanf need & before the variable?", options: ["It makes the number positive", "It gives scanf the variable's address so it can store the value there", "It is optional and only for style"], answer: 1, why: "scanf writes into memory, so it needs to know where the variable lives." },
    { q: "Which specifier reads a double with scanf?", options: ["%f", "%lf", "%d"], answer: 1, why: "scanf uses %lf for double. %f is for float." }
  ],
  practice: {
    task: "Read a temperature in Celsius and print it in Fahrenheit. The formula is F = C × 9 / 5 + 32.",
    hint: "Use float, not int. With two ints, 9 / 5 gives 1.",
    solution: String.raw`#include <stdio.h>

int main(void) {
    float c;
    printf("Temperature in Celsius: ");
    scanf("%f", &c);
    float f = c * 9 / 5 + 32;
    printf("That is %.2f Fahrenheit\n", f);
    return 0;
}`,
    input: "37",
    output: "Temperature in Celsius: 37\nThat is 98.60 Fahrenheit"
  }
},
{
  title: "Operators",
  summary: "Maths, comparisons and logic.",
  body: [
    "The arithmetic operators are <code>+ - * /</code> and <code>%</code>. The <code>%</code> operator gives the remainder of a division and only works with whole numbers.",
    "When both numbers are ints, <code>/</code> throws away the decimal part. <code>17 / 5</code> is 3, not 3.4. Make one of them a decimal, like <code>17.0 / 5</code>, to get 3.4.",
    "Comparisons (<code>== != &lt; &gt; &lt;= &gt;=</code>) give 1 for true and 0 for false. You can join them with <code>&amp;&amp;</code> (and), <code>||</code> (or) and <code>!</code> (not).",
    "<code>x++</code> adds 1 to x. <code>x += 5</code> is short for <code>x = x + 5</code>. To print a percent sign with printf, write <code>%%</code>."
  ],
  code: String.raw`#include <stdio.h>

int main(void) {
    int a = 17, b = 5;
    printf("a + b = %d\n", a + b);
    printf("a - b = %d\n", a - b);
    printf("a * b = %d\n", a * b);
    printf("a / b = %d\n", a / b);
    printf("a %% b = %d\n", a % b);
    printf("17.0 / 5 = %.1f\n", 17.0 / 5);
    return 0;
}`,
  output: "a + b = 22\na - b = 12\na * b = 85\na / b = 3\na % b = 2\n17.0 / 5 = 3.4",
  mistake: "Writing <code>float half = 1 / 2;</code> and getting 0. The division happens with ints first, then the result is stored. Write <code>1.0 / 2</code>.",
  predict: {
    code: String.raw`int i = 5;
int j = i++;
int k = ++i;
printf("%d %d %d\n", i, j, k);`,
    options: ["7 5 7", "6 6 7", "7 6 7"],
    answer: 0,
    why: "i++ hands back the old value (5) and then adds 1, so j is 5 and i is 6. ++i adds 1 first, so i becomes 7 and k is 7."
  },
  quiz: [
    { q: "With int variables, what is 9 / 2?", options: ["4.5", "4", "5"], answer: 1, why: "Integer division drops the decimal part." },
    { q: "What is the value of (5 > 3 && 2 > 4)?", options: ["1", "0", "5"], answer: 1, why: "2 > 4 is false, and && needs both sides true." }
  ],
  practice: {

  var main = document.getElementById("main");
  var nav = document.getElementById("lessonNav");
  var menuBtn = document.getElementById("menuBtn");
  var heroTimer = null;

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  var KW = {};
  ("int float double char void return if else for while do switch case break continue default " +
   "struct typedef const unsigned long short sizeof static NULL FILE size_t").split(" ").forEach(function (k) { KW[k] = 1; });

  function highlight(src) {
    var re = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(^[ \t]*#[^\n]*)|(\b\d+(?:\.\d+)?f?\b)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)/gm;
    var out = "", last = 0, m;
    function span(c, t) { return '<span class="tk-' + c + '">' + esc(t) + "</span>"; }
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      var t = m[0];
      if (m[1]) out += span("com", t);
      else if (m[2]) out += span("str", t);
      else if (m[3]) out += span("pre", t);
      else if (m[4]) out += span("num", t);
      else if (m[5]) out += KW[t] ? span("kw", t) : span("fn", t);
      else out += KW[t] ? span("kw", t) : esc(t);
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }

  var codeStore = [];
  function codeBlock(src, withOutput) {
    var id = codeStore.push(src) - 1;
    return '<div class="code' + (withOutput ? " has-output" : "") + '">' +
      '<button class="copy" data-copy="' + id + '">Copy</button>' +
      "<pre><code>" + highlight(src) + "</code></pre></div>";
  }
  function outputBlock(text, label) {
    return '<div class="output"><span class="label">' + esc(label || "Output") + "</span><pre>" + esc(text) + "</pre></div>";
  }

  function renderNav(current) {
    var h = '<ol><li><a class="home-link" href="#/"' + (current === -1 ? ' aria-current="page"' : "") + ">Start here</a></li>";
    LESSONS.forEach(function (l, i) {
      h += '<li><a href="#/lesson/' + (i + 1) + '"' + (i === current ? ' aria-current="page"' : "") + ">" +
        '<span class="num">' + String(i + 1).padStart(2, "0") + "</span>" +
        "<span>" + esc(l.title) + "</span>" +
        '<span class="tick">' + (isDone(i) ? '✓<span class="sr" style="position:absolute;left:-9999px"> done</span>' : "") + "</span></a></li>";
    });
    nav.innerHTML = "<h2>12 lessons</h2>" + h + "</ol>";
    var n = done.length;
    document.getElementById("progText").textContent = n + " of " + LESSONS.length + " done";
    document.getElementById("progBar").style.width = (n / LESSONS.length * 100) + "%";
  }

  function choicesHtml(options, group, mono) {
    return '<div class="choices">' + options.map(function (o, k) {
      return '<button class="choice" data-group="' + group + '" data-k="' + k + '"' + (mono ? "" : ' style="font-family:var(--sans)"') + ">" + esc(o) + "</button>";
    }).join("") + '</div><div class="fb" id="fb-' + group + '"></div>';
  }

  var answers = {};

  function renderLesson(i) {
    var l = LESSONS[i];
    codeStore = []; answers = {};
    var h = "<article>";
    h += '<p class="crumb">Lesson ' + (i + 1) + " of " + LESSONS.length + "</p>";
    h += "<h1>" + esc(l.title) + "</h1>";
    h += '<p class="lede">' + esc(l.summary) + "</p>";
    l.body.forEach(function (b) { h += b.indexOf("<ul>") === 0 ? b : "<p>" + b + "</p>"; });

    h += "<h2>Example</h2>";
    h += codeBlock(l.code, true) + outputBlock(l.output, l.outputLabel);

    var p = l.predict;
    answers.pred = { answer: p.answer, why: p.why, out: p.options[p.answer], file: !!p.test };
    h += "<h2>Predict the output</h2>";
    h += "<p>Read the code and decide what it prints before you pick.</p>";
    h += '<div class="predict">' + codeBlock(p.code) +
      "<p>" + esc(p.question || "What does this print?") + "</p>" + choicesHtml(p.options, "pred", true) + "</div>";

    h += '<div class="mistake"><h3>Common mistake</h3><p>' + l.mistake + "</p></div>";

    h += "<h2>Quick check</h2>";
    l.quiz.forEach(function (q, k) {
      var g = "q" + k;
      answers[g] = { answer: q.answer, why: q.why };
      h += '<div class="q"><p>' + esc(q.q) + "</p>" + choicesHtml(q.options, g, false) + "</div>";
    });

    var pr = l.practice;
    h += "<h2>Practice</h2><p>" + esc(pr.task) + "</p>";
    h += "<p>Write it on your own computer first. Open the hint if you get stuck, and the solution to compare.</p>";
    h += "<details><summary>Hint</summary><div><p style=\"margin:0\">" + esc(pr.hint) + "</p></div></details>";
    h += "<details><summary>Solution</summary><div>" + codeBlock(pr.solution, true) +
      outputBlock(pr.output, pr.input ? "Output when you type " + pr.input : "Output") + "</div></details>";

    var d = isDone(i);
    h += '<div class="lesson-end">';
    h += '<button class="btn' + (d ? " done" : "") + '" id="doneBtn" aria-pressed="' + d + '">' + (d ? "✓ Marked as done" : "Mark lesson as done") + "</button>";
    h += '<span class="spacer"></span>';
    if (i > 0) h += '<a class="btn" href="#/lesson/' + i + '">Previous</a>';
    if (i < LESSONS.length - 1) h += '<a class="btn primary" href="#/lesson/' + (i + 2) + '">Next: ' + esc(LESSONS[i + 1].title) + "</a>";
    else h += '<a class="btn primary" href="#/">Back to start</a>';
    h += "</div></article>";
    main.innerHTML = h;

    document.getElementById("doneBtn").addEventListener("click", function () {
      if (isDone(i)) done = done.filter(function (x) { return x !== i; });
      else done.push(i);
      save();
      renderNav(i);
      var b = this, nowDone = isDone(i);
      b.classList.toggle("done", nowDone);
      b.setAttribute("aria-pressed", nowDone);
      b.textContent = nowDone ? "✓ Marked as done" : "Mark lesson as done";
    });
  }

  function renderHome() {
    codeStore = [];
    var next = 0;
    for (var k = 0; k < LESSONS.length; k++) { if (!isDone(k)) { next = k; break; } }
    var started = done.length > 0;
    var h = '<article><div class="hero">';
    h += "<h1>Learn C by writing small programs</h1>";
    h += '<p class="lede" style="margin:0">Twelve short lessons take you from your first <code>printf</code> to reading and writing files. Each lesson has a working example, a predict-the-output puzzle, a quick check and a practice problem.</p>';
    h += '<div class="hero-term" aria-label="Example: compiling and running hello.c">' +
      "<pre><code>" + highlight('#include <stdio.h>\n\nint main(void) {\n    printf("Hello, world!\\n");\n    return 0;\n}') + "</code></pre>" +
      '<div class="run" id="heroRun"></div></div>';
    h += '<p style="margin:0"><a class="btn primary" href="#/lesson/' + (next + 1) + '">' +
      (started ? "Continue with lesson " + (next + 1) : "Start lesson 1") + "</a></p>";
    h += "</div>";

    h += "<h2>Set up a compiler</h2>";
    h += "<p>You need a C compiler to run your code. GCC is free and works on every system.</p>";
    h += '<div class="os">' +
      "<div><h3>Windows</h3><p>Install MinGW-w64, or an editor that bundles it such as Code::Blocks. Then use <code>gcc</code> from the command prompt.</p></div>" +
      "<div><h3>macOS</h3><p>Open Terminal and run:</p><pre class=\"cmd\">xcode-select --install</pre></div>" +
      "<div><h3>Linux</h3><p>On Ubuntu or Debian:</p><pre class=\"cmd\">sudo apt install gcc</pre></div></div>";
    h += "<p>To compile and run a file called <code>hello.c</code>:</p><pre class=\"cmd\">gcc hello.c -o hello\n./hello</pre>";
    h += "<p>No computer of your own? Search for an online C compiler, paste the code, and press run.</p>";

    h += "<h2>How to use each lesson</h2>";
    h += '<ol class="steps">' +
      "<li><span>Read the short explanation and the example.</span></li>" +
      "<li><span>Type the example yourself instead of copying it. Your fingers learn the syntax.</span></li>" +
      "<li><span>Answer the predict-the-output puzzle before you run anything.</span></li>" +
      "<li><span>Take the quick check, then solve the practice problem on your own.</span></li>" +
      "<li><span>Mark the lesson as done. Your progress is saved in this browser.</span></li></ol>";
    if (started) h += '<p><button class="btn" id="resetBtn">Clear my progress</button></p>';
    h += "</article>";
    main.innerHTML = h;

    var rb = document.getElementById("resetBtn");
    if (rb) rb.addEventListener("click", function () {
      if (confirm("Clear all lessons marked as done?")) { done = []; save(); route(); }
    });
    playHero();
  }

  function playHero() {
    var el = document.getElementById("heroRun");
    if (!el) return;
    var lines = [
      { t: "$ gcc hello.c -o hello", dim: true },
      { t: "$ ./hello", dim: true },
      { t: "Hello, world!", dim: false }
    ];
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    function paint(li, ch) {
      var h = "";
      for (var a = 0; a < lines.length; a++) {
        if (a < li) h += '<span class="' + (lines[a].dim ? "dim" : "") + '">' + esc(lines[a].t) + "</span>\n";
        else if (a === li) h += '<span class="' + (lines[a].dim ? "dim" : "") + '">' + esc(lines[a].t.slice(0, ch)) + '</span><span class="caret"></span>';
      }
      if (li >= lines.length) h += '<span class="dim">$ </span><span class="caret"></span>';
      el.innerHTML = h;
    }
    if (reduce) { paint(lines.length, 0); return; }
    var li = 0, ch = 0;
    clearInterval(heroTimer);
    heroTimer = setInterval(function () {
      if (li >= lines.length) { clearInterval(heroTimer); paint(li, 0); return; }
      var line = lines[li];
      if (!line.dim) { paint(li + 1, 0); li++; return; }
      ch++;
      if (ch > line.t.length) { li++; ch = 0; }
      paint(li, ch);
    }, 45);
  }

  function route() {
    clearInterval(heroTimer);
    var m = location.hash.match(/^#\/lesson\/(\d+)/);
    var i = m ? parseInt(m[1], 10) - 1 : -1;
    if (i < -1 || i >= LESSONS.length) i = -1;
    renderNav(i);
    if (i === -1) renderHome(); else renderLesson(i);
    nav.classList.remove("open");
    menuBtn.setAttribute("aria-expanded", "false");
    window.scrollTo(0, 0);
    var h1 = main.querySelector("h1");
    if (h1 && document.activeElement && document.activeElement !== document.body) { h1.setAttribute("tabindex", "-1"); h1.focus({ preventScroll: true }); }
  }

  main.addEventListener("click", function (e) {
    var copy = e.target.closest(".copy");
    if (copy) {
      var src = codeStore[+copy.getAttribute("data-copy")];
      var ok = function () { copy.textContent = "Copied"; setTimeout(function () { copy.textContent = "Copy"; }, 1500); };
      var fallback = function () {
        var ta = document.createElement("textarea");
        ta.value = src; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); ok(); } catch (err) { copy.textContent = "Select and copy"; }
        document.body.removeChild(ta);
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(src).then(ok, fallback);
        else fallback();
      } catch (err) { fallback(); }
      return;
    }
    var c = e.target.closest(".choice");
    if (c && !c.disabled) {
      var g = c.getAttribute("data-group");
      var k = +c.getAttribute("data-k");
      var a = answers[g];
      var all = main.querySelectorAll('.choice[data-group="' + g + '"]');
      all.forEach(function (b) {
        b.disabled = true;
        if (+b.getAttribute("data-k") === a.answer) b.classList.add("right");
      });
      var correct = k === a.answer;
      if (!correct) c.classList.add("wrong");
      var fb = document.getElementById("fb-" + g);
      var html = '<div class="feedback ' + (correct ? "good" : "nope") + '" role="status"><b>' +
        (correct ? "Correct." : "Not this one. The right answer is marked in green.") + "</b>" + esc(a.why) + "</div>";
      if (g === "pred") html = '<div class="term-print' + (a.file ? " file" : "") + '">' + esc(a.out) + "</div>" + html;
      fb.innerHTML = html;
    }
  });

  menuBtn.addEventListener("click", function () {
    var open = nav.classList.toggle("open");
    menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
  });

  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
